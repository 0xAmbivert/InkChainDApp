<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Professional dApp</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel to run JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    <!-- Inlining the script to avoid XMLHttpRequest/CORS issues with Babel in browser environments -->
    <script type="text/babel">
        // Accessing hooks and components from the global React object
        const { useState, useEffect } = React;

        // Configuration for InkChain
        const INK_CONFIG = {
            chainId: "0xdef1", // 57073 in hex
            chainName: "Ink",
            rpcUrls: ["https://rpc.inkonchain.com"],
            nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
            blockExplorerUrls: ["https://explorer.inkonchain.com"],
        };

        const WETH_ABI = [
            "function deposit() public payable",
            "function withdraw(uint256 wad) public",
            "function balanceOf(address owner) view returns (uint256)"
        ];

        const WETH_ADDRESS = "0x4200000000000000000000000000000000000006";

        function App() {
            const [account, setAccount] = useState(null);
            const [balance, setBalance] = useState("0");
            const [status, setStatus] = useState({ type: 'info', msg: 'Welcome to Ink' });
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('transfer');
            const [ethersLib, setEthersLib] = useState(null);

            // Inputs
            const [txTarget, setTxTarget] = useState('');
            const [txAmount, setTxAmount] = useState('');

            // Load ethers and icons
            useEffect(() => {
                const script = document.createElement('script');
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js";
                script.async = true;
                script.onload = () => {
                    setEthersLib(window.ethers);
                };
                document.body.appendChild(script);
                
                // Initialize Lucide icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const notify = (type, msg) => {
                setStatus({ type, msg });
                setTimeout(() => setStatus({ type: 'info', msg: 'Ink Mainnet Active' }), 5000);
            };

            const connectWallet = async () => {
                if (!window.ethereum) return notify('error', 'Please install MetaMask');
                if (!ethersLib) return notify('error', 'Network library loading...');
                
                setLoading(true);
                try {
                    const provider = new ethersLib.BrowserProvider(window.ethereum);
                    
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: INK_CONFIG.chainId }],
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [INK_CONFIG],
                            });
                        }
                    }

                    const signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    const bal = await provider.getBalance(address);
                    
                    setAccount(address);
                    setBalance(ethersLib.formatEther(bal));
                    notify('success', 'Connected to InkChain');
                } catch (err) {
                    notify('error', err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSendEth = async () => {
                if (!txTarget || !txAmount) return notify('error', 'Fill all fields');
                setLoading(true);
                try {
                    const provider = new ethersLib.BrowserProvider(window.ethereum);
                    const signer = await provider.getSigner();
                    const tx = await signer.sendTransaction({
                        to: txTarget,
                        value: ethersLib.parseEther(txAmount)
                    });
                    notify('info', 'Broadcasting...');
                    await tx.wait();
                    notify('success', 'Transfer Confirmed!');
                    const bal = await provider.getBalance(account);
                    setBalance(ethersLib.formatEther(bal));
                } catch (err) {
                    notify('error', err.message);
                } finally {
                    setLoading(false);
                }
            };

            // Custom SVG Icons to replace Lucide if library is slow to load
            const IconZap = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
            const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>;

            return (
                <div className="min-h-screen bg-[#050505] text-slate-100 font-sans p-4">
                    <div className="max-w-4xl mx-auto">
                        <nav className="flex items-center justify-between h-20 mb-8">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-purple-600 rounded-xl flex items-center justify-center">
                                    <IconZap />
                                </div>
                                <span className="text-xl font-bold">INK<span className="text-purple-500 font-black">CORE</span></span>
                            </div>
                            
                            {account ? (
                                <div className="bg-white/5 px-4 py-2 rounded-full border border-white/10 text-sm">
                                    {account.slice(0,6)}...{account.slice(-4)} | {parseFloat(balance).toFixed(4)} ETH
                                </div>
                            ) : (
                                <button onClick={connectWallet} className="bg-white text-black px-6 py-2 rounded-full font-bold flex items-center gap-2">
                                    <IconWallet /> Connect
                                </button>
                            )}
                        </nav>

                        <div className={`p-4 rounded-xl border mb-8 ${status.type === 'error' ? 'bg-red-500/10 border-red-500/20 text-red-400' : 'bg-white/5 border-white/10 text-slate-400'}`}>
                            {status.msg}
                        </div>

                        <div className="bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-xl">
                            <h2 className="text-2xl font-black mb-6 uppercase">Native Transfer</h2>
                            <div className="space-y-6">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500 uppercase">Recipient</label>
                                    <input 
                                        type="text" 
                                        className="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-sm font-mono"
                                        placeholder="0x..."
                                        value={txTarget}
                                        onChange={e => setTxTarget(e.target.value)}
                                    />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500 uppercase">Amount (ETH)</label>
                                    <input 
                                        type="number" 
                                        className="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-sm"
                                        placeholder="0.0"
                                        value={txAmount}
                                        onChange={e => setTxAmount(e.target.value)}
                                    />
                                </div>
                                <button 
                                    onClick={handleSendEth}
                                    disabled={loading || !account}
                                    className="w-full bg-purple-600 py-4 rounded-xl font-black uppercase tracking-widest disabled:opacity-50"
                                >
                                    {loading ? 'Processing...' : 'Send ETH'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
